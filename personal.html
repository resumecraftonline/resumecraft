<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Personal Details | ResumeCraft</title>

<meta name="description"
    content="Enter your personal information and start creating your professional resume with ResumeCraft.">

<meta name="robots" content="noindex, follow">

    <link rel="stylesheet"
        href="css/style.css">

    <link rel="stylesheet"
        href="css/personal.css">

</head>

<body>


    <header class="header">

        <div class="container header-container">

            <a href="index.html"
                class="logo">

                Resume<span>Craft</span>

            </a>

            <div class="step-indicator">
                Step 2 of 6
            </div>

        </div>

    </header>


    <main class="form-page">

        <div class="container form-container">


            <div class="page-heading">

                <span>PERSONAL INFORMATION</span>

                <h1>
                    Tell Us About Yourself
                </h1>

                <p>
                    Add your basic professional details.
                </p>

            </div>


            <div class="form-card">


                <form id="personalForm">


                    <!-- PHOTO -->

                    <div class="photo-section">

                        <div id="photoPreview"
                            class="photo-preview">

                            <span>Photo</span>

                        </div>

                        <div>

                            <label for="profilePhoto"
                                class="upload-label">

                                Upload Profile Photo

                            </label>

                            <input type="file"
                                id="profilePhoto"
                                accept="image/*">

                            <p class="small-text">
                                Optional profile photo
                            </p>

                        </div>

                    </div>


                    <div class="form-grid">


                        <div class="form-group">

                            <label for="fullName">
                                Full Name *
                            </label>

                            <input type="text"
                                id="fullName"
                                placeholder="Enter your full name"
                                required>

                        </div>


                        <div class="form-group">

                            <label for="jobTitle">
                                Professional Title
                            </label>

                            <input type="text"
                                id="jobTitle"
                                placeholder="Example: Web Developer">

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Email Address *
                            </label>

                            <input type="email"
                                id="email"
                                placeholder="example@email.com"
                                required>

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Phone Number *
                            </label>

                            <input type="tel"
                                id="phone"
                                placeholder="+91 9876543210"
                                required>

                        </div>


                        <div class="form-group">

                            <label for="location">
                                Location
                            </label>

                            <input type="text"
                                id="location"
                                placeholder="City, State">

                        </div>


                        <div class="form-group">

                            <label for="linkedin">
                                LinkedIn
                            </label>

                            <input type="text"
                                id="linkedin"
                                placeholder="linkedin.com/in/username">

                        </div>


                        <div class="form-group full-width">

                            <label for="portfolio">
                                Portfolio / Website
                            </label>

                            <input type="text"
                                id="portfolio"
                                placeholder="www.yourwebsite.com">

                        </div>


                        <div class="form-group full-width">

                            <label for="summary">
                                Professional Summary
                            </label>

                            <textarea id="summary"
                                rows="6"
                                placeholder="Write a short professional summary about yourself..."></textarea>

                        </div>


                    </div>


                    <div class="form-actions">

                        <button type="button"
                            id="backButton"
                            class="back-button">

                            ← Back

                        </button>


                        <button type="submit"
                            class="next-button">

                            Save & Continue →

                        </button>

                    </div>


                </form>

            </div>


        </div>

    </main>

<footer class="footer"><div class="container footer-container">

    <div>
        <div class="footer-logo">
            Resume<span>Craft</span>
        </div>

        <p>
            Create professional resumes quickly and easily.
        </p>
    </div>


    <div class="footer-links">

        <a href="about.html">About Us</a>

        <a href="privacy.html">Privacy Policy</a>

        <a href="terms.html">Terms & Conditions</a>

        <a href="contact.html">Contact Us</a>

    </div>

</div>


<div class="container footer-bottom">
    © 2026 ResumeCraft. All rights reserved.
</div>

</footer>
    <script src="js/personal.js"></script>

</body>

</html>
