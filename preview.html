<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  
<title>Resume Preview | ResumeCraft</title>

<meta name="description"
    content="Preview and print your professional resume created with ResumeCraft.">

<meta name="robots" content="noindex, follow">
    <link rel="stylesheet"
        href="css/style.css">

    <link rel="stylesheet"
        href="css/preview.css">

</head>

<body>


    <header class="header preview-header">

        <div class="container header-container">

            <a href="index.html"
                class="logo">

                Resume<span>Craft</span>

            </a>


            <div class="preview-actions-top">

                <button id="editResume"
                    class="back-button">

                    ← Edit

                </button>

                <button id="downloadPDF"
                    class="next-button">

                    Download PDF

                </button>

            </div>

        </div>

    </header>


    <main class="preview-page">


        <div class="container">


            <div class="page-heading">

                <span>STEP 6 OF 6</span>

                <h1>
                    Your Resume is Ready
                </h1>

                <p>
                    Review your resume before downloading.
                </p>

            </div>


            <!-- ADVERTISEMENT -->

            <div class="ad-box preview-ad">

                Advertisement

            </div>


            <!-- RESUME ACTIONS -->

            <div class="resume-actions">

                <button id="printResume"
                    class="back-button">

                    🖨 Print

                </button>

                <button id="downloadPDFTop"
                    class="next-button">

                    Download PDF

                </button>

            </div>


            <!-- RESUME -->

            <div class="resume-wrapper">

                <div id="resume"
                    class="resume classic">

                    <!-- Resume generated by JavaScript -->

                </div>

            </div>


            <!-- BOTTOM ACTIONS -->

            <div class="resume-actions bottom-resume-actions">

                <button id="createNew"
                    class="back-button">

                    + Create New

                </button>

                <button id="downloadPDFBottom"
                    class="next-button">

                    Download Resume

                </button>

            </div>


        </div>

    </main>


    

<footer class="footer"><div class="container footer-container">

    <div>
        <div class="footer-logo">
            Resume<span>Craft</span>
        </div>

        <p>
            Create professional resumes quickly and easily.
        </p>
    </div>


    <div class="footer-links">

        <a href="about.html">About Us</a>

        <a href="privacy.html">Privacy Policy</a>

        <a href="terms.html">Terms & Conditions</a>

        <a href="contact.html">Contact Us</a>

    </div>

</div>


<div class="container footer-bottom">
    © 2026 ResumeCraft. All rights reserved.
</div>

</footer>
    <script src="js/preview.js"></script>

</body>

</html>
